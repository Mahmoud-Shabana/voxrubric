name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m compileall -q src
      - run: pytest --cov=voxrubric --cov-report=term-missing
      - run: voxrubric eval --trace examples/session.json --rubric examples/python_engineer.yaml --out report.json
      - run: voxrubric benchmark benchmarks/adversarial/suite.yaml --out benchmark-result.json
      - run: voxrubric arena examples/arena.yaml --out arena-result.json
